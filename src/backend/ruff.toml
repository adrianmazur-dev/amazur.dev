target-version = "py314"
line-length = 120
src = ["src"]

[lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "ASYNC",
    "S",
    "C4",
    "T20",
    "PT",
    "RET",
    "RUF",
]
ignore = ["S101"]
fixable = ["ALL"]

[lint.isort]
known-first-party = ["text_chunking_service"]
combine-as-imports = true

[lint.per-file-ignores]
"tests/**/*.py" = ["ASYNC240", "S101"]

[format]
quote-style = "double"
indent-style = "space"
