name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  check-backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "src/backend/uv.lock"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check

      - name: Run Ruff format check
        run: uv run ruff format --check

      - name: Run ty type checker
        run: uv run ty check

  check-frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check & build Astro project
        run: npm run build

  release:
    name: Version & Release
    needs: [check-backend, check-frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.semver.outputs.version_tag }}
      image_prefix: ${{ steps.semver.outputs.image_prefix }}
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version and create GitHub Release
        id: semver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_BUMP: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail

          IMAGE_PREFIX="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image_prefix=${IMAGE_PREFIX}" >> "$GITHUB_OUTPUT"

          # 1. Triggered directly by pushing a v*.*.* tag
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            echo "Triggered from tag: ${VERSION_TAG}"
            if ! gh release view "${VERSION_TAG}" >/dev/null 2>&1; then
              gh release create "${VERSION_TAG}" --generate-notes --title "${VERSION_TAG}"
            fi
            echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Triggered by push to main or workflow_dispatch: calculate next SemVer
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)

          if [[ -z "${LATEST_TAG}" ]]; then
            MAJOR=0
            MINOR=1
            PATCH=0
            VERSION_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          else
            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${VERSION}"

            BUMP_TYPE="${INPUT_BUMP}"
            if [[ "${BUMP_TYPE}" == "auto" ]]; then
              COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s %b" || true)
              if echo "${COMMITS}" | grep -Eq '(BREAKING CHANGE|^[a-zA-Z]+(\([^)]+\))?!:)'; then
                BUMP_TYPE="major"
              elif echo "${COMMITS}" | grep -Eq '^feat(\([^)]+\))?:'; then
                BUMP_TYPE="minor"
              else
                BUMP_TYPE="patch"
              fi
            fi

            case "${BUMP_TYPE}" in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              *)
                PATCH=$((PATCH + 1))
                ;;
            esac

            VERSION_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Creating release ${VERSION_TAG} (previous: ${LATEST_TAG:-none})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION_TAG}" -m "Release ${VERSION_TAG}"
          git push origin "${VERSION_TAG}"
          gh release create "${VERSION_TAG}" --generate-notes --title "${VERSION_TAG}"

          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build & Push Docker Images (${{ matrix.service }})
    needs: [release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: src/${{ matrix.service }}
          file: src/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ needs.release.outputs.image_prefix }}/${{ matrix.service }}:${{ needs.release.outputs.version_tag }}
            ${{ needs.release.outputs.image_prefix }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    needs: [release, build-images]
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Run deploy.sh on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: ${{ secrets.VPS_DEPLOY_PATH }}/deploy.sh
